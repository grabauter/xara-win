name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpulse-dev libasound2-dev
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +stable test --locked --release --workspace
      - run: cargo +stable build --locked --release -p xara --no-default-features --features alsa
      - run: cargo +stable build --locked --release -p xara --no-default-features --features wasapi

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --locked --workspace --all-targets --no-default-features --features wasapi -- -D warnings
      - run: cargo +stable test --locked --release --workspace --no-default-features --features wasapi

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpulse-dev libasound2-dev
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 build --locked --release --workspace --all-targets

  arm:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-unknown-linux-musl, runner: qemu-aarch64 }
          - { target: armv7-unknown-linux-musleabihf, runner: qemu-arm }
          - { target: arm-unknown-linux-musleabihf, runner: qemu-arm -cpu arm1176 }
        turbo: [default, float-turbo]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: test under qemu
        shell: bash
        run: |
          t=$(echo '${{ matrix.target }}' | tr a-z- A-Z_)
          export CARGO_TARGET_${t}_LINKER=rust-lld
          export CARGO_TARGET_${t}_RUSTFLAGS='-C link-self-contained=yes -C linker-flavor=ld.lld'
          export CARGO_TARGET_${t}_RUNNER='${{ matrix.runner }}'
          features=()
          if [ '${{ matrix.turbo }}' != default ]; then features=(--features 'xara-phy/${{ matrix.turbo }}'); fi
          cargo +stable test --locked --release --target ${{ matrix.target }} \
            -p xara-phy -p xara-arq -p xara-host "${features[@]}"
