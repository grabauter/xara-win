[package]
name = "xara"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "A VARA-compatible HF/FM modem for Linux and Windows with PipeWire/PulseAudio/ALSA/WASAPI audio I/O and a passive monitor."

[dependencies]
xara-phy.workspace = true
xara-arq.workspace = true
xara-host.workspace = true
xara-ui.workspace = true
libc.workspace = true

[target.'cfg(unix)'.dependencies]
alsa-sys.workspace = true

[target.'cfg(windows)'.dependencies]
cpal.workspace = true

[dev-dependencies]
xara-testkit.workspace = true

[features]
# every backend names a platform's audio API; features gate intent, cfg gates platform,
# so the same default feature set builds cleanly on Linux and Windows
default = ["pulse", "alsa", "wasapi"]
pulse = []
alsa = []
wasapi = []
registered = []
fixed-turbo = ["xara-phy/fixed-turbo"]
float-turbo = ["xara-phy/float-turbo"]
